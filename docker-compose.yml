services:
  mongo:
    image: mongo:8.2
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # Tiny init process as PID 1: forwards SIGTERM to Node and reaps zombies.
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      BASE_URL: http://localhost:3000
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: url_shortener
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
